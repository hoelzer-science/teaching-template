# Single source of truth for everything that changes between semesters.
# Referenced from .qmd files as e.g. {{< meta course.semester >}} so that
# rolling the course over to a new term is a one-file edit.
#
# In the template these are PLACEHOLDERS. A module repo overwrites them with
# its real values -- and because module repos are private, the real course
# code, institution and term never appear in a public repository.

course:
  title: "Course Title"
  audience: "BSc Semester N"
  code: "MODULE.CODE"
  semester: "Winter 20XX/XX"
  # The date of the FIRST LECTURE, not the first week of term -- schedule.qmd
  # renders it as "First lecture <date>". Timetable week 1 frequently carries no
  # lecture, which is also why that page numbers sessions rather than weeks.
  start-date: "20XX-10-01"
  sws-lecture: 2
  sws-practical: 2
  institution: "Your Institution"
  instructor: "Your Name"
  contact: "you@example.org"
  # Name of the learning management system used alongside the course site --
  # it carries the login, announcements and hand-ins. Referenced in guide.qmd,
  # so set it to whatever your institution runs (e.g. "Moodle", "Ilias").
  lms: "the course learning platform"
  # Kept for the record. Not rendered as a link anywhere -- guide.qmd refers to
  # the LMS in plain text, so an unset value here cannot produce a broken link.
  lms-url: "TODO — LMS course URL"

# Live polls at the start of each lecture, wired through
# shared/partials/poll.qmd. The split matters:
#
#   join-url    the PARTICIPATION address students type in. Stable across every
#               lecture and every semester, so it lives here, paired with
#               shared/figures/polleverywhere-qr.png.
#   poll-url    the PRESENTER address, which changes per lecture and per
#               semester. It is NOT here -- each deck sets its own `poll-url:`
#               in its YAML front matter, and that one line is the only poll
#               edit a semester rollover needs.
#
# MUST STAY URL-SHAPED even while it is a placeholder. A bare "TODO" renders as
# a *local* link and fails scripts/check-links.sh, which is the right instinct
# from the checker and a confusing way to hear about it.
polls:
  join-url: "https://pollev.com/TODO-your-participation-address"
